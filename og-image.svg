<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     font-family="Inter, system-ui, sans-serif">
  <defs>
    <!-- Graph-paper graticule for the figure frame -->
    <pattern id="graticule" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0V28M0 28H28" fill="none" stroke="#e9e5db" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Warm paper stock -->
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <!-- ============ Left column ============ -->
  <g transform="translate(76, 74)">
    <circle cx="14" cy="14" r="12" fill="none" stroke="#1a1917" stroke-width="2"/>
    <path d="M8 14a6 6 0 0 1 12 0" fill="none" stroke="#1a1917" stroke-width="2" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="2.5" fill="#c4451f"/>
    <text x="38" y="21" font-size="20" font-weight="600" fill="#1a1917" letter-spacing="-0.3">Plasmid<tspan fill="#797569" font-weight="400">Studio</tspan></text>
  </g>

  <g transform="translate(76, 158)">
    <circle cx="4" cy="-5" r="4" fill="#c4451f"/>
    <text x="20" y="0" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="13"
          font-weight="500" fill="#797569" letter-spacing="2">FREE TO USE &#183; OPEN SOURCE &#183; NO ACCOUNT</text>
  </g>

  <text x="76" y="248" font-size="64" font-weight="600" fill="#1a1917" letter-spacing="-2.4">Plasmid maps,</text>
  <text x="76" y="316" font-size="64" font-weight="600" fill="#797569" letter-spacing="-2.4">drawn properly.</text>

  <text x="76" y="374" font-size="21" fill="#57544e">A circular and linear map editor that runs</text>
  <text x="76" y="404" font-size="21" fill="#57544e">entirely in your browser.</text>

  <line x1="76" y1="444" x2="640" y2="444" stroke="#e4e0d6" stroke-width="1"/>
  <text x="76"  y="472" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="12" font-weight="500" fill="#797569" letter-spacing="1.6">IMPORT</text>
  <text x="188" y="472" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="13" fill="#57544e">GenBank &#183; FASTA &#183; SnapGene &#183; NCBI</text>
  <line x1="76" y1="492" x2="640" y2="492" stroke="#e4e0d6" stroke-width="1"/>
  <text x="76"  y="520" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="12" font-weight="500" fill="#797569" letter-spacing="1.6">EXPORT</text>
  <text x="188" y="520" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="13" fill="#57544e">SVG &#183; PNG &#183; PDF &#183; GenBank</text>
  <line x1="76" y1="540" x2="640" y2="540" stroke="#e4e0d6" stroke-width="1"/>

  <!-- ============ Right figure frame ============ -->
  <rect x="740" y="110" width="384" height="384" fill="#fdfcfa"/>
  <rect x="740" y="110" width="384" height="384" fill="url(#graticule)"/>
  <rect x="740" y="110" width="384" height="384" fill="none" stroke="#e4e0d6" stroke-width="1"/>

  <g fill="none" stroke="#1a1917" stroke-width="2">
    <path d="M740 124V110h14"/>
    <path d="M1110 110h14v14"/>
    <path d="M740 480v14h14"/>
    <path d="M1110 494h14v-14"/>
  </g>

  <g transform="translate(932, 302)">
    <circle cx="0" cy="0" r="118" fill="none" stroke="#ddd8cb" stroke-width="7"/>

    <path d="M 83.44 -83.44 A 118 118 0 0 1 118 0"        fill="none" stroke="#22a35a" stroke-width="12" stroke-linecap="round"/>
    <path d="M 118 0 A 118 118 0 0 1 0 118"               fill="none" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
    <path d="M -41.72 110.4 A 118 118 0 0 1 -118 0"       fill="none" stroke="#e08700" stroke-width="12" stroke-linecap="round"/>
    <path d="M -102.19 -59 A 118 118 0 0 1 -59 -102.19"   fill="none" stroke="#c4451f" stroke-width="12" stroke-linecap="round"/>
    <path d="M -29.5 -114.26 A 118 118 0 0 1 29.5 -114.26" fill="none" stroke="#7c3aed" stroke-width="12" stroke-linecap="round"/>

    <g stroke="#b8b2a4" stroke-width="1.5">
      <line x1="0" y1="-98" x2="0" y2="-106"/>
      <line x1="98" y1="0" x2="106" y2="0"/>
      <line x1="0" y1="98" x2="0" y2="106"/>
      <line x1="-98" y1="0" x2="-106" y2="0"/>
    </g>

    <text x="0" y="-4" text-anchor="middle" font-size="22" font-weight="600" fill="#1a1917" letter-spacing="-0.5">pUC19</text>
    <text x="0" y="20" text-anchor="middle" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="12" fill="#797569" letter-spacing="0.5">2,686 bp</text>
  </g>

  <text x="740" y="522" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="12"
        font-weight="500" fill="#797569" letter-spacing="1.4">EXAMPLE &#183; pUC19 &#183; CIRCULAR</text>

  <!-- ============ Footer ============ -->
  <line x1="76" y1="570" x2="1124" y2="570" stroke="#e4e0d6" stroke-width="1"/>
  <text x="76" y="597" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="12"
        font-weight="500" fill="#797569" letter-spacing="1.4">MIT LICENSED &#183; NOTHING UPLOADED</text>
  <text x="1124" y="597" text-anchor="end" font-family="ui-monospace, DejaVu Sans Mono, monospace" font-size="12"
        font-weight="500" fill="#c4451f" letter-spacing="1.4">plasmidstudio.app</text>
</svg>
